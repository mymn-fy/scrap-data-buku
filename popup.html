<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Book Scraper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <span class="brand-mark">✦</span>
                <h3>Book Scraper</h3>
            </div>
            <a href="settings.html" target="_blank" class="settings-link" title="Pengaturan">⚙</a>
        </div>

        <div id="status-area" class="panel">
            <p id="status-text">Mendeteksi data buku...</p>
            <div id="confidence-bar-container">
                <div id="confidence-bar"></div>
            </div>
            <p id="confidence-text"></p>
        </div>

        <div id="results-area" class="panel hidden">
            <table id="results-table">
                <!-- Data rows will be injected by JS -->
            </table>
            <div id="price-mode-row" class="price-mode-row hidden">
                <label><input type="checkbox" id="use-original-price"> Gunakan harga awal (dicoret), bukan harga diskon</label>
            </div>
            <div class="edit-controls hidden">
                <label><input type="checkbox" id="auto-recalculate" checked> Hitung eksemplar otomatis</label>
            </div>
            <div class="button-group">
                <button id="edit-btn">Edit Data</button>
                <button id="copy-btn">Salin Data</button>
            </div>
        </div>

        <div class="footer">
            <button id="rescan-btn">Ekstraksi Ulang</button>
        </div>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>
